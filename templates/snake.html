<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale: 1.0">
    <title>Juego de la Serpiente</title>
    <style>
        #game-container {
            width: 300px;
            height: 300px;
            border: 2px solid #333;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            margin: 0 auto;
            background-color: #212121;
            position: relative;
        }
        .cell {
            border: 1px solid #1a1a1a;
            background-color: #333;
            transition: background-color 0.2s ease;
        }
        .snake {
            background-color: #fff;
            box-shadow: 0px 0px 5px rgba(255, 255, 255, 0.7);
        }
        .food {
            background-color: #f00;
        }
        .special-food {
            background-color: #0f0;
        }
        #score, #high-scores {
            margin: 10px;
            font-size: 18px;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        #container {
            text-align: center;
        }
        h1 {
            font-size: 24px;
        }
        #name-input {
            display: none;
            margin: 20px 0;
        }
        input[type="text"] {
            padding: 5px;
            font-size: 18px;
            margin-right: 10px;
        }
        button {
            padding: 5px 10px;
            font-size: 18px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        /* Barra de tiempo fuera del área de la cuadrícula */
        .timer-bar {
            height: 10px;
            background-color: #0f0;
            width: 100%; /* Ancho al 100% de la pantalla */
            margin-top: 10px; /* Espacio entre la cuadrícula y la barra de tiempo */
            display: none; /* Inicialmente oculta */
        }
        .timer-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        #high-scores ul {
            padding: 0;
            list-style-type: none;
        }
        #high-scores li {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Juego de la Serpiente</h1>
        <div id="score">Puntuación: 0</div>
        <div id="game-container"></div>
        <div id="name-input">
            <input type="text" id="player-name" placeholder="Ingresa tu nombre">
            <button onclick="saveHighScore()">Guardar Puntaje</button>
        </div>
        <!-- Barra de tiempo (fuera del juego pero dentro del contenedor) -->
        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div id="high-scores">
            <h2>Mejores Puntajes</h2>
            <ul id="score-list"></ul>
        </div>
    </div>

    <script>
        const gameContainer = document.getElementById("game-container");
        const scoreDisplay = document.getElementById("score");
        const highScoreList = document.getElementById("score-list");
        const nameInput = document.getElementById("name-input");
        const playerNameInput = document.getElementById("player-name");
        const gridSize = 20;
        let snake = [{ x: 5, y: 5 }];
        let food = { x: 10, y: 10 };
        let specialFood = null;
        let specialFoodTimer = 0;
        let direction = "right";
        let gameOver = false;
        let score = 0;
        let speed = 100;
        let gameInterval;
        let specialFoodTimeout;
        let specialFoodExpireTime = 5000; // Tiempo de expiración de la comida verde en 5 segundos
        let foodSpawnTime = 180000; // Tiempo para reaparecer la comida especial en 180 segundos (3 minutos)

        function loadHighScores() {
            const highScores = JSON.parse(localStorage.getItem("highScores")) || [];
            highScoreList.innerHTML = "";
            highScores.sort((a, b) => b.score - a.score).slice(0, 5).forEach(scoreData => {
                const li = document.createElement("li");
                li.textContent = `${scoreData.name}: ${scoreData.score}`;
                highScoreList.appendChild(li);
            });
        }

        function saveHighScore() {
            const name = playerNameInput.value.trim();
            if (!name) return;

            const highScores = JSON.parse(localStorage.getItem("highScores")) || [];
            highScores.push({ name, score });
            highScores.sort((a, b) => b.score - a.score);

            // Solo guardar si está en el top 5
            if (highScores.length > 5) {
                highScores.pop();
            }

            localStorage.setItem("highScores", JSON.stringify(highScores));
            loadHighScores();
            nameInput.style.display = "none";
            restartGame();
        }

        function drawGame() {
            gameContainer.innerHTML = "";
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const cell = document.createElement("div");
                    cell.classList.add("cell");
                    gameContainer.appendChild(cell);
                }
            }

            snake.forEach(segment => {
                const snakeCell = gameContainer.children[segment.y * gridSize + segment.x];
                snakeCell.classList.add("snake");
            });

            const foodCell = gameContainer.children[food.y * gridSize + food.x];
            foodCell.classList.add("food");

            if (specialFood) {
                const specialFoodCell = gameContainer.children[specialFood.y * gridSize + specialFood.x];
                specialFoodCell.classList.add("special-food");
            }
        }

        function moveSnake() {
            const head = Object.assign({}, snake[0]);
            switch (direction) {
                case "up":
                    head.y--;
                    break;
                case "down":
                    head.y++;
                    break;
                case "left":
                    head.x--;
                    break;
                case "right":
                    head.x++;
                    break;
            }
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                generateFood();
                speed = Math.max(50, speed - 10);
                updateScore();
            } else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
                score += 20;
                clearTimeout(specialFoodTimeout);
                specialFood = null; // Comida especial comida, desaparece
                setTimeout(generateSpecialFood, foodSpawnTime); // Generar comida especial en 180 segundos
                updateScore();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * gridSize);
            food.y = Math.floor(Math.random() * gridSize);
        }

        function generateSpecialFood() {
            specialFood = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };
            specialFoodTimer = Date.now();

            // Mostrar la barra de tiempo solo si la comida especial está en pantalla
            const timerBar = document.getElementById("timer-bar");
            timerBar.style.display = "block"; // Muestra la barra de tiempo
            timerBar.style.width = "100%";
            let timeLeft = specialFoodExpireTime / 1000;

            const timerInterval = setInterval(() => {
                timeLeft--;
                timerBar.style.width = `${(timeLeft / 5) * 100}%`;

                if (timeLeft <= 0) {
                    specialFood = null; // La comida especial desaparece si no se come
                    timerBar.style.display = "none"; // Oculta la barra de tiempo
                    clearInterval(timerInterval);
                    setTimeout(generateSpecialFood, foodSpawnTime); // Generar nueva comida especial en 180 segundos
                    drawGame();
                }
            }, 1000);
        }

        function checkCollision() {
            const head = snake[0];
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                gameOver = true;
                return;
            }
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    return;
                }
            }
        }

        function handleKeydown(event) {
            switch (event.key) {
                case "ArrowUp":
                    if (direction !== "down") direction = "up";
                    break;
                case "ArrowDown":
                    if (direction !== "up") direction = "down";
                    break;
                case "ArrowLeft":
                    if (direction !== "right") direction = "left";
                    break;
                case "ArrowRight":
                    if (direction !== "left") direction = "right";
                    break;
            }
        }

        function updateScore() {
            scoreDisplay.textContent = "Puntuación: " + score;
        }

        function restartGame() {
            snake = [{ x: 5, y: 5 }];
            direction = "right";
            gameOver = false;
            score = 0;
            speed = 100;
            generateFood();
            generateSpecialFood();
            updateScore();
            gameLoop();
        }

        function gameLoop() {
            if (gameOver) {
                nameInput.style.display = "block";
                return;
            }

            moveSnake();
            checkCollision();
            drawGame();
        }

        document.addEventListener("DOMContentLoaded", function() {
            generateFood();
            generateSpecialFood();
            loadHighScores();
            gameInterval = setInterval(gameLoop, speed);
            document.addEventListener("keydown", handleKeydown);
        });
    </script>
</body>
</html>
