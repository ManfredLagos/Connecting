{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <form method="POST" action="/register">
        <div class="form-group">
            
            <input type="text" id="nickname" name="nickname" placeholder="Ingrese su nombre" required>
        </div>
        <div class="form-group">
            
            <input type="text" id="lastname" name="lastname" placeholder="Ingrese sus apellidos" required>
        </div>
        <div class="form-group">
            
            <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required>
        </div>
        <div class="password-container"> 
            <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required>
            <span class="password-toggle" onclick="togglePasswordVisibility()">
                <!-- Utilizamos el ícono de "ojo" de Font Awesome -->
                <i class="fa fa-eye"></i>
            </span>
        </div>
        <div class="form-group">
            
            <input type="date" id="age" name="age" required>
        </div>
        <div class="form-group">
            
            <select id="country" name="country" class="custom-select" required>
                <option value="">Seleccionar país</option>
                <option value="Argentina">Argentina</option>
                <option value="Brasil">Brasil</option>
                <option value="Chile">Chile</option>
                <option value="Colombia">Colombia</option>
                <option value="Costa Rica">Costa Rica</option>
                <option value="México">México</option>
                <option value="Perú">Perú</option>
                <option value="España">España</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <!-- Agrega más opciones según sea necesario -->
            </select>
        </div>
        <div class="form-group">
            <button type="submit">Crear Registro</button>
        </div>
    </form>
</div>
{% endblock %}
